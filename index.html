<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loop Hacking</title>
  <link rel="icon" type="image/png" href="https://loopviewonly.github.io/speed-typing/looplogo.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cookie&family=Share+Tech+Mono&display=swap');:root{--ink:#020704;--panel:#06110a;--line:#24512f;--cyan:#74ffc1;--lime:#b5f752;--muted:#8db29a;--danger:#ff7785}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#123a20 0,transparent 42%),#020704;color:#deffe9;font-family:"Share Tech Mono",Consolas,monospace;letter-spacing:.3px}.grid{position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(#67f58a1c 1px,transparent 1px),linear-gradient(90deg,#67f58a1c 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(to bottom,black,transparent)}.wrap{width:min(1140px,calc(100% - 32px));margin:auto;min-height:100vh;display:flex;flex-direction:column}.top{padding:27px 0 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-size:20px;letter-spacing:2px;font-weight:800;color:var(--lime)}.brand b{color:var(--cyan)}.top-level{margin-left:12px;color:var(--muted);font-size:13px}.top-level:empty{display:none}main{flex:1;display:grid;place-items:center;padding:32px 0 36px}.card{width:min(720px,100%);padding:clamp(24px,5vw,48px);background:#06110af2;border:1px solid var(--line);border-radius:3px;box-shadow:0 24px 80px #000b,inset 0 1px #ffffff0b;animation:enter .4s ease both}@keyframes enter{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}.card h1{letter-spacing:-.8px;font-size:clamp(28px,5vw,43px);margin:12px 0}.card p{line-height:1.55;color:#bdd4c2;margin:0 0 16px}.info{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:7px;padding:0;border:1px solid var(--cyan);border-radius:50%;color:var(--cyan);background:transparent;font-size:12px;cursor:pointer;vertical-align:middle;box-shadow:none}.info-panel{margin:13px 0 0;padding:11px 13px;border-left:2px solid var(--cyan);background:#04140a;color:#c8f9d1;font-size:13px;line-height:1.45}.email{width:min(440px,100%);margin:21px 0 18px;padding:17px;background:#f4f6f8;color:#1b2734;border-radius:4px;box-shadow:0 7px 16px #0006;font-family:Arial,sans-serif}.email small{display:block;color:#61707c;margin-bottom:11px}.email p{color:#1b2734;margin:0}.blur-link{color:#275e9e;text-decoration:underline;user-select:none;pointer-events:none}.terminal{padding:14px 16px;border-left:3px solid var(--lime);background:#010502;color:#a8dfaf;line-height:1.75;margin:22px 0}.terminal b{color:var(--lime)}button{border:1px solid #5dba72;border-radius:2px;padding:13px 18px;background:var(--lime);color:#061108;font:700 14px inherit;cursor:pointer;box-shadow:0 7px 24px #43e0bf18;transition:.2s}button:hover{transform:translateY(-2px);filter:brightness(1.08)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.message{min-height:23px;color:var(--danger);font-size:13px;margin-top:16px}.message.good{color:var(--lime)}.answer{width:100%;padding:14px;border:1px solid #32613b;border-radius:2px;background:#010502;color:#e9ffeb;outline:0;font:16px inherit}.answer:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #61f3d120}.fake-url{padding:15px;word-break:break-all;background:#010502;border:1px solid #274b2f;border-radius:2px;color:#d9f8df}.fake-url span{color:inherit}.login-fields{display:grid;gap:10px;margin-top:16px}.field-label{font-size:12px;color:var(--muted);margin-bottom:-5px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:22px}.choice{width:100%;text-align:center;padding:17px 10px;background:#07150b;color:#e6ffeb;border:1px solid #315d3a;border-radius:2px}.choice:hover{border-color:var(--cyan);background:#102b17}.choice code{color:#c9ff7c;font-size:15px;word-break:break-all}.codebox{border-radius:2px;overflow:hidden;border:1px solid #285233;background:#010502;margin:22px 0}.codebar{padding:10px 14px;background:#0a2110;color:#81a78a;font-size:12px}.code{padding:20px;color:#83dc92;line-height:1.75}.console-word{color:var(--lime)}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:24px 0}.tile{height:120px;border:0;border-radius:2px;background:#f6fbfb;color:#06131b;cursor:pointer;transition:.2s}.tile:hover{transform:scale(1.025);box-shadow:0 8px 24px #0004}.tile span{display:block;opacity:.15;font-size:13px}.shake{animation:shake .35s linear}@keyframes shake{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}.matrix-screen{position:fixed;inset:0;z-index:10;overflow:hidden;display:grid;place-items:center;background:#000}.matrix-rain{position:absolute;inset:0;display:flex;justify-content:space-around;overflow:hidden}.rain-column{width:2.3%;height:160%;margin-top:-55%;color:#7aff45;font-size:16px;line-height:1.08;word-break:break-all;text-shadow:0 0 8px #4dff2b;opacity:.5;animation:rain linear infinite}.rain-column:nth-child(3n){color:#d7ffb7;opacity:.75}.rain-column:nth-child(4n){animation-duration:8s!important}@keyframes rain{to{transform:translateY(105vh)}}.finish-message{position:relative;z-index:1;width:min(700px,calc(100% - 34px));padding:48px 25px;text-align:center;background:#001b0799;border:1px solid #4fae49;box-shadow:0 0 55px #00ff4438}.congrats{color:var(--lime);text-transform:uppercase;letter-spacing:4px;font-size:13px;margin-bottom:12px}.finish-message h1{margin:0;color:#efffe9;font-size:clamp(31px,6vw,62px);text-shadow:0 0 15px #77ff53}.finish-message button{margin-top:28px}.corner-logo{position:fixed;right:22px;bottom:22px;z-index:5;width:124px;height:56px;display:grid;place-items:center;background:#172235;border-radius:12px;box-shadow:0 8px 22px #0005}.corner-logo img{max-width:88px;max-height:36px;object-fit:contain}.card.wide{width:min(1080px,100%)}.insta-box{display:flex;gap:36px;align-items:center;justify-content:center;margin-top:24px}.insta-left{flex:1;max-width:420px;background:#ffffff;color:#000000;padding:36px 30px;border-radius:10px;border:1px solid #dbdbdb;text-align:center;box-shadow:0 8px 32px #0009}.insta-right{flex:1.6;max-width:600px}.insta-img{width:100%;height:auto;max-height:640px;object-fit:contain;border-radius:12px;border:1px solid var(--line);box-shadow:0 10px 30px #000c;display:block}.insta-logo{font-family:'Cookie','Grand Hotel',cursive,sans-serif;font-size:54px;margin-bottom:24px;color:#262626;line-height:1}.insta-input{width:100%;padding:15px 13px;margin-bottom:12px;background:#fafafa;border:1px solid #dbdbdb;border-radius:6px;font-size:15px;color:#262626;outline:none;box-sizing:border-box;font-family:inherit}.insta-input:focus{border-color:#a8a8a8;background:#fff}.insta-pass-wrap{position:relative;width:100%;margin-bottom:12px}.insta-pass-wrap .insta-input{margin-bottom:0;padding-right:48px}.insta-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;padding:4px;font-size:19px;color:#8e8e8e;line-height:1;box-shadow:none;user-select:none}.insta-eye:hover{background:transparent;transform:translateY(-50%);filter:brightness(.7)}.insta-btn{width:100%;padding:14px;background:#0095f6;color:#fff;border:none;border-radius:6px;font-weight:600;font-size:16px;cursor:pointer;margin-top:12px;transition:background .2s;font-family:inherit;box-shadow:none}.insta-btn:hover{background:#1877f2;transform:none}@media(max-width:840px){.insta-box{flex-direction:column-reverse}.insta-left,.insta-right{max-width:100%}}@media(max-width:520px){.top{padding-top:18px}.card{padding:25px 22px}.tile{height:96px}.choices{grid-template-columns:1fr}.corner-logo{right:12px;bottom:12px;width:90px;height:42px}.corner-logo img{max-width:64px;max-height:27px}}
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <header class="top"><div class="brand">LOOP <b>HACKING</b><span class="top-level" id="topLevel"></span></div></header>
    <main id="app"></main>
    <div class="corner-logo"><img src="https://loopviewonly.github.io/speed-typing/looplogo.png" alt="Loop logo"></div>
  </div>
  <script>
    const app=document.querySelector('#app'),topLevel=document.querySelector('#topLevel');let level=0;
    const info=(text)=>`<button class="info" type="button" data-info="${text}" aria-label="More information">i</button>`;
    const shell=(eyebrow,title,body,actions='',cardClass='')=>`<section class="card ${cardClass}"><h1>${title}</h1>${body}${actions}</section>`;
    function next(){level++;render()}
    function render(){if(level===0){topLevel.textContent='';return welcome()}topLevel.textContent='LVL '+level+'/11';if(level===1)return levelOne();if(level===2)return levelTwo();if(level===3)return instaLevel();if(level===4)return passwordLevel('Password strength I',['P@ssword1','summer2026','rT!8vQ#2mL$7'],2);if(level===5)return passwordLevel('Password strength II',['admin123','M0on!River#204','qwerty'],1);if(level===6)return passwordLevel('Password strength III',['LoopAI2026','vL!7@Nexa_Orbit#94','football!'],1);if(level===7)return decoderLevel();if(level===8)return levelFour();if(level===9)return choiceLevel('Link check','Which link matches the real domain?',['https://l00p.org.il','https://loop.org.il','https://loop-check.org.il'],1);if(level===10)return capitalLevel();if(level===11)return levelFive();finish()}
    function welcome(){app.innerHTML='<section class="card" style="text-align:center"><div class="congrats">Welcome</div><h1>Loop Hacking Challenges</h1><p>Eleven quick challenges. Ready?</p><div class="actions" style="justify-content:center"><button id="start">Start →</button></div></section>';document.querySelector('#start').onclick=()=>{level=1;render()}}
    function levelOne(){app.innerHTML=shell('Email check','Safe or not safe? '+info('Check the address carefully before trusting a password request.'),'<div class="email"><small>From: Account Support</small><p>Dear user,<br>Please update your password:<br><span class="blur-link">https://instagrm.com</span></p></div>','<div class="actions"><button id="safe">Safe</button><button id="unsafe">Not safe</button></div><div class="message" id="message"></div>');document.querySelector('#safe').onclick=()=>message('Not quite. Look closely at the website spelling.');document.querySelector('#unsafe').onclick=()=>{const msg=document.querySelector('#message');msg.textContent='Correct. The address is misspelled.';msg.className='message good';setTimeout(next,550)}}
    function levelTwo(){app.innerHTML=shell('Reading URLs','Read the URL '+info('Values after = are parameter values. Enter both the username and password values.'),'<div class="fake-url">https://loop.org.il?username=ziko&amp;password=batata</div><div class="login-fields"><label class="field-label" for="username">Username</label><input class="answer" id="username" autocomplete="off"><label class="field-label" for="password">Password</label><input class="answer" id="password" autocomplete="off"></div>','<div class="actions"><button id="checkUrl">Verify</button></div><div class="message" id="message"></div>');document.querySelector('#checkUrl').onclick=()=>{const msg=document.querySelector('#message');if(document.querySelector('#username').value.trim()==='ziko'&&document.querySelector('#password').value.trim()==='batata'){msg.textContent='Accepted.';msg.className='message good';setTimeout(next,550)}else{msg.textContent='Try again.';msg.className='message'}};bindEnter('username','checkUrl');bindEnter('password','checkUrl')}
    function instaLevel(){app.innerHTML=shell('Profile Intelligence','Guess the Account '+info('Look closely at the profile picture, username, and highlights on the right image.'),'<div class="insta-box"><div class="insta-left"><div class="insta-logo">Instagram</div><input class="insta-input" id="instaUser" placeholder="Username" autocomplete="off"><div class="insta-pass-wrap"><input class="insta-input" type="password" id="instaPass" placeholder="Password" autocomplete="off"><button class="insta-eye" type="button" id="togglePass" aria-label="Toggle password visibility">👁️</button></div><button class="insta-btn" id="checkInsta">Log In</button></div><div class="insta-right"><img src="insta.jpg" alt="Instagram Profile Clue" class="insta-img"></div></div>','<div class="message" id="message"></div>','wide');const passInput=document.querySelector('#instaPass'),eyeBtn=document.querySelector('#togglePass');eyeBtn.onclick=()=>{if(passInput.type==='password'){passInput.type='text';eyeBtn.textContent='🙈'}else{passInput.type='password';eyeBtn.textContent='👁️'}};document.querySelector('#checkInsta').onclick=()=>{const u=document.querySelector('#instaUser').value.trim().toLowerCase(),p=document.querySelector('#instaPass').value.trim(),msg=document.querySelector('#message');if(u==='jerry5bata'&&p==='lola2005'){msg.textContent='Access granted.';msg.className='message good';setTimeout(next,550)}else{msg.textContent='Incorrect username or password.';msg.className='message';document.querySelector('.card').classList.remove('shake');void app.offsetWidth;document.querySelector('.card').classList.add('shake')}};bindEnter('instaUser','checkInsta');bindEnter('instaPass','checkInsta')}
    function passwordLevel(name,choices,strongest){const buttons=choices.map((x,i)=>'<button class="choice" data-choice="'+i+'"><code>'+x+'</code></button>').join('');app.innerHTML=shell(name,'Strongest password '+info('Long, unique, mixed characters.'),'<p>Choose one.</p><div class="choices">'+buttons+'</div><div class="message" id="message"></div>');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(+b.dataset.choice===strongest){document.querySelector('#message').textContent='Correct.';document.querySelector('#message').className='message good';setTimeout(next,650)}else{document.querySelector('#message').textContent='Try again.';document.querySelector('.card').classList.remove('shake');void app.offsetWidth;document.querySelector('.card').classList.add('shake')}})}
    function choiceLevel(name,prompt,choices,correct){const buttons=choices.map((x,i)=>'<button class="choice" data-choice="'+i+'"><code>'+x+'</code></button>').join('');app.innerHTML=shell(name,prompt,'<div class="choices">'+buttons+'</div><div class="message" id="message"></div>');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(+b.dataset.choice===correct){document.querySelector('#message').textContent='Correct.';document.querySelector('#message').className='message good';setTimeout(next,550)}else message('Try again.')})}
    function decoderLevel(){app.innerHTML=shell('Number decoder','Decode the message '+info('A=1, B=2, C=3, and so on.'),'<div class="codebox"><div class="codebar">decoder.makefile</div><div class="code">A = 1<br>B = 2<br>C = 3<br>...<br>Y = 25<br>Z = 26<br><br><span class="console-word">Code: 3   1   20</span></div></div><input class="answer" id="decodeAnswer" placeholder="Decoded message" autocomplete="off">','<div class="actions"><button id="decode">Verify</button></div><div class="message" id="message"></div>');document.querySelector('#decode').onclick=()=>check('decodeAnswer','cat');bindEnter('decodeAnswer','decode')}
    function levelFour(){console.info('%cLOOP HACKING CLUE: You Are Cool','color:#b5f752;font-size:14px;font-weight:bold');app.innerHTML=shell('Developer tools','Console clue '+info('Open developer tools, then Console.'),'<p>Find the message in your browser console.</p><div class="codebox"><div class="codebar">training-script.js</div><div class="code">console.info(<span class="console-word">&quot;A clue was sent to the console.&quot;</span>);</div></div><input class="answer" id="consoleAnswer" placeholder="Console clue" autocomplete="off">','<div class="actions"><button id="checkConsole">Verify</button></div><div class="message" id="message"></div>');document.querySelector('#checkConsole').onclick=()=>check('consoleAnswer','you are cool');bindEnter('consoleAnswer','checkConsole')}
    function capitalLevel(){app.innerHTML=shell('Quick knowledge','What is the capital of Canada?','<input class="answer" id="capitalAnswer" placeholder="Your answer" autocomplete="off">','<div class="actions"><button id="checkCapital">Verify</button></div><div class="message" id="message"></div>');document.querySelector('#checkCapital').onclick=()=>check('capitalAnswer','ottawa');bindEnter('capitalAnswer','checkCapital')}
    function levelFive(){app.innerHTML=shell('Challenge 1 — Find the clue','Something hidden '+info('Inspect the HTML or the boxes.'),'<p>One white box has the password in its HTML.</p><div class="tiles"><button class="tile"><span>tile 01</span></button><button class="tile"><span>tile 02</span></button><button class="tile" data-password="LoopAI"><span>tile 03</span></button><button class="tile"><span>tile 04</span></button></div><input class="answer" id="hiddenAnswer" placeholder="Hidden password" autocomplete="off">','<div class="actions"><button id="checkHidden">Verify</button></div><div class="message" id="message"></div>');document.querySelector('#checkHidden').onclick=()=>check('hiddenAnswer','loopai');bindEnter('hiddenAnswer','checkHidden')}
    function bindEnter(inputId,buttonId){document.querySelector('#'+inputId).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.querySelector('#'+buttonId).click()}})}
    function check(id,correct){const input=document.querySelector('#'+id),msg=document.querySelector('#message');if(input.value.trim().toLowerCase()===correct){msg.textContent='Access granted.';msg.className='message good';setTimeout(next,550)}else{msg.textContent='That is not the clue. Inspect and try again.';msg.className='message';document.querySelector('.card').classList.remove('shake');void app.offsetWidth;document.querySelector('.card').classList.add('shake');input.focus()}}
    function message(text){const msg=document.querySelector('#message');msg.textContent=text;msg.className='message';document.querySelector('.card').classList.remove('shake');void app.offsetWidth;document.querySelector('.card').classList.add('shake')}
    function showInfo(button){const existing=document.querySelector('.info-panel');if(existing){existing.remove();if(button.dataset.open==='yes'){button.dataset.open='';return}}document.querySelectorAll('.info').forEach(i=>i.dataset.open='');button.dataset.open='yes';const panel=document.createElement('div');panel.className='info-panel';panel.textContent=button.dataset.info;button.closest('h1').insertAdjacentElement('afterend',panel)}
    app.addEventListener('click',e=>{const button=e.target.closest('.info');if(button){e.preventDefault();e.stopPropagation();showInfo(button)}})
    function finish(){topLevel.textContent='';const bits=Array.from({length:43},(_,i)=>'<div class="rain-column" style="animation-duration:'+(7+Math.random()*8).toFixed(1)+'s;animation-delay:-'+(Math.random()*9).toFixed(1)+'s">'+Array.from({length:120},()=>Math.random()>.5?'1':'0').join('<br>')+'</div>').join('');app.innerHTML='<section class="matrix-screen"><div class="matrix-rain">'+bits+'</div><div class="finish-message"><div class="congrats">Congratulations</div><h1>You cracked Loop Hacking</h1><button id="again">Run it again</button></div></section>';document.querySelector('#again').onclick=()=>{level=0;render()}}
    render();
  </script>
</body>
</html>
